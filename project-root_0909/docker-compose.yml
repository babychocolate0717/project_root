services:
  db:
    image: postgres:13
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 168.95.1.1
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: energy
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ingestion-api/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d energy"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion:
    build:
      context: ./ingestion-api
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 168.95.1.1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./ingestion-api:/code
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cleaner:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - AUTH_SECRET_KEY=NTCUST-ENERGY-MONITOR
      - COMPATIBILITY_MODE=true
      - DEFAULT_ALLOWED_IPS=""
      - DATABASE_URL=postgresql://user:password@db:5432/energy

  cleaner:
    build:
      context: ./cleaning-api
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 168.95.1.1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload
    volumes:
      - ./cleaning-api:/code
    ports:
      - "8100:8100"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/energy

  # --- 新增 Grafana 服務 ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - db
    environment:
      - GF_PANELS_DISABLE_SANITIZE_HTML=true

volumes:
  pgdata:
  grafana-storage: {} # --- 新增 Grafana 的 volume ---